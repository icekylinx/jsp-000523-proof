name: Lean build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install elan
        run: |
          set -o pipefail
          curl -sSfL https://github.com/leanprover/elan/releases/download/v4.2.2/elan-x86_64-unknown-linux-gnu.tar.gz | tar xz
          ./elan-init -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Fetch dependencies and Mathlib cache
        run: |
          lake exe cache get
      - name: Build formalization
        run: lake build JSP523
      - name: Check placeholders
        run: bash scripts/check_no_sorry.sh
      - name: Check submission interfaces
        run: lake env lean verification/Submission.lean
